name: Validar reglas Radar de Cultura
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/cvf-rules.cjs'
      - '.github/workflows/validate-cvf-rules.yml'
      - 'firebase.json'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar herramientas para pruebas (sin credenciales)
        run: npm install --no-save --no-package-lock firebase-tools@latest @firebase/rules-unit-testing@latest firebase@latest
      - name: Probar permisos en emulador de Firestore
        run: npx firebase emulators:exec --only firestore --project demo-cvf-local "node tests/cvf-rules.cjs"
